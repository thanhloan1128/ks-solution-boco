[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bokp-ks"
version = "0.1.0"
description = "BOKP Kalai-Smorodinsky computation with Gurobi"
requires-python = ">=3.11"
dependencies = ["gurobipy==13.0.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]