[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bostp-ks"
version = "0.1.0"
description = "Reproducible Kalai-Smorodinsky experiments for bi-objective spanning trees"
requires-python = ">=3.10"
dependencies = ["networkx>=3.2"]

[project.optional-dependencies]
gurobi = ["gurobipy>=11.0"]
dev = ["pytest>=8.0"]

[project.scripts]
bostp-ks = "bostp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]